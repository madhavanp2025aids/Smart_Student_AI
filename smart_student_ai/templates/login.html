<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - MentoraMind</title>
	<link rel="stylesheet" href="/static/css/style.css">
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		body {
			background: #080c14 !important;
			font-family: 'Outfit', sans-serif !important;
			overflow-x: hidden;
			color: #e2e8f0;
		}

		.background-animation {
			background: radial-gradient(circle at 50% 50%, #0d1527 0%, #050811 100%) !important;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -2;
		}

		/* Enhanced Vibrant Floating Blobs */
		.shape {
			filter: blur(110px) !important;
			opacity: 0.55;
			transition: all 1s ease;
		}

		.shape-1 {
			width: 380px;
			height: 380px;
			background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(99, 102, 241, 0) 70%) !important;
			top: -80px;
			left: -80px;
			animation: floatDiagonal 18s ease-in-out infinite;
		}

		.shape-2 {
			width: 420px;
			height: 420px;
			background: radial-gradient(circle, rgba(217, 70, 239, 0.35) 0%, rgba(217, 70, 239, 0) 70%) !important;
			top: 35%;
			right: -120px;
			animation: floatWave 20s ease-in-out infinite;
			animation-delay: 2s;
		}

		.shape-3 {
			width: 320px;
			height: 320px;
			background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(59, 130, 246, 0) 70%) !important;
			bottom: -60px;
			left: 15%;
			animation: floatSpiral 22s ease-in-out infinite;
			animation-delay: 4s;
		}

		.shape-4 {
			width: 480px;
			height: 480px;
			background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(168, 85, 247, 0) 70%) !important;
			bottom: -120px;
			right: 12%;
			animation: floatPulse 16s ease-in-out infinite;
			animation-delay: 1s;
		}

		.login-container {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 40px 20px;
			position: relative;
			z-index: 1;
		}

		/* Dark Futuristic Glassmorphism Card */
		.login-card {
			background: rgba(15, 23, 42, 0.55);
			backdrop-filter: blur(25px);
			-webkit-backdrop-filter: blur(25px);
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 28px;
			padding: 55px 45px;
			max-width: 460px;
			width: 100%;
			box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6),
			            0 0 50px rgba(99, 102, 241, 0.15);
			animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
			position: relative;
			overflow: hidden;
			transition: border-color 0.5s ease, box-shadow 0.5s ease, transform 0.3s ease;
		}

		.login-card:hover {
			border-color: rgba(255, 255, 255, 0.14);
			box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.7),
			            0 0 60px rgba(217, 70, 239, 0.22);
			transform: translateY(-2px);
		}

		/* Glowing card top indicator */
		.login-card::after {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 4px;
			background: linear-gradient(90deg, #6366f1, #d946ef, #3b82f6);
			background-size: 200% auto;
			animation: flowGradient 4s linear infinite;
		}

		@keyframes flowGradient {
			0% { background-position: 0% 50%; }
			100% { background-position: 200% 50%; }
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.login-header {
			text-align: center;
			margin-bottom: 35px;
		}

		/* Spinning Glowing Gradient Logo Ring */
		.icon-circle {
			width: 76px;
			height: 76px;
			background: rgba(15, 23, 42, 0.6);
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 38px;
			margin: 0 auto 22px;
			position: relative;
			z-index: 1;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
		}

		.icon-circle::before {
			content: '';
			position: absolute;
			inset: -3px;
			border-radius: 50%;
			background: linear-gradient(135deg, #6366f1, #d946ef, #3b82f6);
			z-index: -1;
			animation: rotateLogoRing 6s linear infinite;
		}

		@keyframes rotateLogoRing {
			100% { transform: rotate(360deg); }
		}

		.login-header h1 {
			font-size: 34px;
			font-weight: 800;
			margin: 0;
			letter-spacing: -0.5px;
			margin-bottom: 8px;
			background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			font-family: 'Montserrat', sans-serif;
		}

		.login-header p {
			color: #94a3b8;
			font-size: 14.5px;
			margin: 0;
			font-weight: 500;
			letter-spacing: 0.2px;
			transition: all 0.3s ease;
		}

		.form-group {
			margin-bottom: 24px;
			position: relative;
		}

		.form-group label {
			display: flex;
			align-items: center;
			gap: 6px;
			margin-bottom: 9px;
			color: #cbd5e1;
			font-weight: 600;
			font-size: 12.5px;
			text-transform: uppercase;
			letter-spacing: 0.08em;
		}

		.form-group input {
			width: 100%;
			padding: 14px 18px;
			background: rgba(15, 23, 42, 0.6);
			border: 1.5px solid rgba(255, 255, 255, 0.08);
			border-radius: 12px;
			font-size: 15px;
			color: #ffffff;
			font-family: 'Outfit', sans-serif;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			box-sizing: border-box;
		}

		.form-group input::placeholder {
			color: #64748b;
		}

		.form-group input:focus {
			outline: none;
			border-color: #6366f1;
			background: rgba(15, 23, 42, 0.85);
			box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2),
			            inset 0 2px 4px rgba(0, 0, 0, 0.25);
		}

		/* Interactive Password Visibility Toggle */
		.password-input-wrapper {
			position: relative;
			width: 100%;
		}

		.password-input-wrapper input {
			padding-right: 48px;
		}

		.password-toggle-btn {
			position: absolute;
			right: 16px;
			top: 50%;
			transform: translateY(-50%);
			background: none;
			border: none;
			color: #64748b;
			cursor: pointer;
			padding: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 16px;
			transition: color 0.3s ease, transform 0.2s ease;
		}

		.password-toggle-btn:hover {
			color: #a5b4fc;
			transform: translateY(-50%) scale(1.1);
		}

		/* Vibrant Alert Styling */
		.error-message {
			background: rgba(239, 68, 68, 0.12);
			border: 1px solid rgba(239, 68, 68, 0.25);
			color: #f87171;
			padding: 14px 18px;
			border-radius: 12px;
			margin-bottom: 24px;
			font-size: 14px;
			display: flex;
			align-items: center;
			gap: 10px;
			animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
		}

		@keyframes shake {
			10%, 90% { transform: translate3d(-1px, 0, 0); }
			20%, 80% { transform: translate3d(2px, 0, 0); }
			30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
			40%, 60% { transform: translate3d(4px, 0, 0); }
		}

		/* Glassy Demo Notice */
		.demo-notice {
			background: rgba(59, 130, 246, 0.08);
			border: 1px solid rgba(59, 130, 246, 0.18);
			padding: 18px;
			border-radius: 16px;
			margin-bottom: 25px;
			font-size: 13.5px;
			color: #93c5fd;
			text-align: left;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
		}

		.demo-notice strong {
			display: block;
			margin-bottom: 6px;
			color: #bfdbfe;
			font-weight: 600;
		}

		.demo-notice code {
			background: rgba(0, 0, 0, 0.25);
			padding: 2.5px 6.5px;
			border-radius: 6px;
			color: #60a5fa;
			font-family: monospace;
			font-size: 12px;
			border: 1px solid rgba(255, 255, 255, 0.03);
		}

		/* Submit Button styling */
		.btn-submit {
			width: 100%;
			padding: 15px;
			background: linear-gradient(135deg, #6366f1 0%, #d946ef 50%, #2563eb 100%);
			background-size: 200% auto;
			color: white;
			border: none;
			border-radius: 12px;
			font-size: 15.5px;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
			margin-top: 8px;
			margin-bottom: 16px;
			box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}

		.btn-submit:hover {
			background-position: right center;
			transform: translateY(-2px) scale(1.01);
			box-shadow: 0 8px 25px rgba(217, 70, 239, 0.35);
		}

		.btn-submit:active {
			transform: translateY(0) scale(0.99);
		}

		.toggle-section {
			text-align: center;
			margin-top: 22px;
		}

		.toggle-text {
			color: #64748b;
			font-size: 14px;
		}

		.toggle-btn {
			background: none;
			border: none;
			color: #60a5fa;
			cursor: pointer;
			font-weight: 700;
			font-size: 14px;
			padding: 0;
			margin-left: 5px;
			transition: all 0.3s ease;
			position: relative;
		}

		.toggle-btn::after {
			content: '';
			position: absolute;
			width: 100%;
			transform: scaleX(0);
			height: 1.5px;
			bottom: -2px;
			left: 0;
			background-color: #a78bfa;
			transform-origin: bottom right;
			transition: transform 0.25s ease-out;
		}

		.toggle-btn:hover {
			color: #a78bfa;
			text-shadow: 0 0 10px rgba(167, 139, 250, 0.4);
		}

		.toggle-btn:hover::after {
			transform: scaleX(1);
			transform-origin: bottom left;
		}

		.form-section {
			display: none;
		}

		.form-section.active {
			display: block;
			animation: sectionFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
		}

		@keyframes sectionFadeIn {
			from {
				opacity: 0;
				transform: scale(0.97);
			}
			to {
				opacity: 1;
				transform: scale(1);
			}
		}

		/* Password strength bar */
		.password-strength {
			margin-top: 10px;
			height: 5px;
			background: rgba(255, 255, 255, 0.08);
			border-radius: 10px;
			overflow: hidden;
		}

		.password-strength-bar {
			height: 100%;
			width: 0%;
			background: transparent;
			transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
		}

		.password-strength-bar.weak {
			width: 33%;
			background: linear-gradient(90deg, #ef4444, #f87171);
			box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
		}

		.password-strength-bar.medium {
			width: 66%;
			background: linear-gradient(90deg, #f59e0b, #fbbf24);
			box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
		}

		.password-strength-bar.strong {
			width: 100%;
			background: linear-gradient(90deg, #10b981, #34d399);
			box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
		}

		@media (max-width: 480px) {
			.login-card {
				padding: 40px 25px;
			}

			.login-header h1 {
				font-size: 28px;
			}
		}
	</style>
</head>
<body>
	<div class="background-animation"></div>
	<div class="floating-shapes">
		<div class="shape shape-1"></div>
		<div class="shape shape-2"></div>
		<div class="shape shape-3"></div>
		<div class="shape shape-4"></div>
	</div>

	<div class="login-container">
		<div class="login-card">
			<!-- Logo and Header -->
			<div class="login-header">
				<div class="icon-circle">🎓</div>
				<h1>MentoraMind</h1>
				<p id="header-subtitle">Welcome Back!</p>
			</div>

			<!-- Demo Notice -->
			<div class="demo-notice">
				<strong>📝 Demo Account:</strong>
				Email: <code>demo@example.com</code><br>
				Password: <code>demo123</code>
			</div>

			<!-- Login/Register Form -->
			<form id="authForm" method="POST" action="/login">
				<!-- Error Message -->
				{% if error %}
					<div class="error-message">
						<i class="fas fa-exclamation-triangle"></i>
						<span>{{ error }}</span>
					</div>
				{% endif %}

				<!-- Login Section -->
				<div class="form-section login-section active">
					<div class="form-group">
						<label for="login-email"><i class="far fa-envelope"></i> Email Address</label>
						<input type="email" id="login-email" name="email" placeholder="name@example.com" required>
					</div>

					<div class="form-group">
						<label for="login-password"><i class="fas fa-lock"></i> Password</label>
						<div class="password-input-wrapper">
							<input type="password" id="login-password" name="password" placeholder="Enter your password" required>
							<button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password', this)">
								<i class="far fa-eye"></i>
							</button>
						</div>
					</div>

					<button type="submit" class="btn-submit">
						<i class="fas fa-sign-in-alt"></i> Login
					</button>

					<div class="toggle-section">
						<span class="toggle-text">New to MentoraMind?</span>
						<button type="button" class="toggle-btn" onclick="toggleForm(event)">Create account</button>
					</div>
				</div>

				<!-- Register Section -->
				<div class="form-section register-section">
					<div class="form-group">
						<label for="register-email"><i class="far fa-envelope"></i> Email Address</label>
						<input type="email" id="register-email" name="email" placeholder="name@example.com">
					</div>

					<div class="form-group">
						<label for="register-password"><i class="fas fa-lock"></i> Create Password</label>
						<div class="password-input-wrapper">
							<input type="password" id="register-password" name="password" placeholder="Min. 6 characters" onkeyup="checkPasswordStrength(this.value)">
							<button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('register-password', this)">
								<i class="far fa-eye"></i>
							</button>
						</div>
						<div class="password-strength">
							<div class="password-strength-bar" id="strength-bar"></div>
						</div>
					</div>

					<input type="hidden" name="is_register" value="true">

					<button type="submit" class="btn-submit">
						<i class="fas fa-user-plus"></i> Register
					</button>

					<div class="toggle-section">
						<span class="toggle-text">Already have an account?</span>
						<button type="button" class="toggle-btn" onclick="toggleForm(event)">Login here</button>
					</div>
				</div>
			</form>
		</div>
	</div>

	<script>
		function togglePasswordVisibility(inputId, toggleBtn) {
			const passwordInput = document.getElementById(inputId);
			const icon = toggleBtn.querySelector('i');
			
			if (passwordInput.type === 'password') {
				passwordInput.type = 'text';
				icon.classList.remove('fa-eye');
				icon.classList.add('fa-eye-slash');
			} else {
				passwordInput.type = 'password';
				icon.classList.remove('fa-eye-slash');
				icon.classList.add('fa-eye');
			}
		}

		function toggleForm(event) {
			event.preventDefault();
			
			const loginSection = document.querySelector('.login-section');
			const registerSection = document.querySelector('.register-section');
			const headerSubtitle = document.getElementById('header-subtitle');
			
			loginSection.classList.toggle('active');
			registerSection.classList.toggle('active');
			
			const loginEmail = document.getElementById('login-email');
			const loginPass = document.getElementById('login-password');
			const registerEmail = document.getElementById('register-email');
			const registerPass = document.getElementById('register-password');
			
			// Update header & toggle required fields to avoid hidden required validation error
			if (registerSection.classList.contains('active')) {
				headerSubtitle.textContent = 'Create Your Account';
				document.getElementById('authForm').reset();
				loginEmail.removeAttribute('required');
				loginPass.removeAttribute('required');
				registerEmail.setAttribute('required', '');
				registerPass.setAttribute('required', '');
				
				// Reset password visibility icons to normal eye
				document.querySelectorAll('.password-toggle-btn i').forEach(icon => {
					icon.className = 'far fa-eye';
				});
				document.querySelectorAll('.password-input-wrapper input').forEach(input => {
					input.type = 'password';
				});
				
				document.getElementById('strength-bar').className = 'password-strength-bar';
			} else {
				headerSubtitle.textContent = 'Welcome Back!';
				document.getElementById('authForm').reset();
				loginEmail.setAttribute('required', '');
				loginPass.setAttribute('required', '');
				registerEmail.removeAttribute('required');
				registerPass.removeAttribute('required');
				
				// Reset password visibility icons to normal eye
				document.querySelectorAll('.password-toggle-btn i').forEach(icon => {
					icon.className = 'far fa-eye';
				});
				document.querySelectorAll('.password-input-wrapper input').forEach(input => {
					input.type = 'password';
				});
			}
		}

		function checkPasswordStrength(password) {
			const strengthBar = document.getElementById('strength-bar');
			
			if (password.length === 0) {
				strengthBar.className = 'password-strength-bar';
				return;
			}

			let strength = 0;
			
			// Check length
			if (password.length >= 6) strength++;
			if (password.length >= 8) strength++;
			if (password.length >= 12) strength++;
			
			// Check for numbers
			if (/[0-9]/.test(password)) strength++;
			
			// Check for lowercase
			if (/[a-z]/.test(password)) strength++;
			
			// Check for uppercase
			if (/[A-Z]/.test(password)) strength++;
			
			// Check for special characters
			if (/[^A-Za-z0-9]/.test(password)) strength++;

			strengthBar.className = 'password-strength-bar';
			
			if (strength <= 2) {
				strengthBar.classList.add('weak');
			} else if (strength <= 4) {
				strengthBar.classList.add('medium');
			} else {
				strengthBar.classList.add('strong');
			}
		}

		// Handle form submission
		document.getElementById('authForm').addEventListener('submit', function(e) {
			const registerSection = document.querySelector('.register-section');
			
			if (registerSection.classList.contains('active')) {
				// Registration validation
				const email = document.getElementById('register-email').value.trim();
				const password = document.getElementById('register-password').value;
				
				if (email === '') {
					e.preventDefault();
					alert('Please enter your email');
					return;
				}
				
				if (password.length < 6) {
					e.preventDefault();
					alert('Password must be at least 6 characters');
					return;
				}
			} else {
				// Login validation
				const email = document.getElementById('login-email').value.trim();
				const password = document.getElementById('login-password').value;
				
				if (email === '') {
					e.preventDefault();
					alert('Please enter your email');
					return;
				}
				
				if (password === '') {
					e.preventDefault();
					alert('Please enter your password');
					return;
				}
			}
		});
	</script>
</body>
</html>
